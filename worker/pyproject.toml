[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arclia-worker"
version = "0.1.0"
description = "Arclia (arXiv日本語研究ダイジェスト) Python非同期ジョブワーカー・運用CLI"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary,pool]>=3.1.18",
  "redis>=5.0.0",
  "httpx>=0.27.0",
  "PyMuPDF>=1.24.0",
  "pydantic>=2.7.0",
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]
