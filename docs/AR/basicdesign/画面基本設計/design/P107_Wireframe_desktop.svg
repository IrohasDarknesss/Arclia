<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 750" width="1440" height="750" font-family="Noto Sans JP, sans-serif" font-size="11" role="img" aria-label="料金 ワイヤーフレーム（デスクトップ）">
<rect x="0" y="0" width="1440" height="750" fill="#ffffff"/>
<rect x="0" y="0" width="1440" height="64" rx="0" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
<rect x="40" y="16" width="160" height="32" rx="6" fill="#111827" stroke="#111827" stroke-width="1" data-item-id="H01"/>
<text x="120" y="37" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">サービス名（未決定）</text>
<text x="760" y="38" font-size="13" fill="#374151" font-weight="normal" text-anchor="start" data-item-id="H02">新着論文</text>
<text x="860" y="38" font-size="13" fill="#374151" font-weight="normal" text-anchor="start" data-item-id="H03">論文検索</text>
<text x="960" y="38" font-size="13" fill="#111827" font-weight="bold" text-anchor="start" data-item-id="H04">料金</text>
<line x1="960" y1="46" x2="986" y2="46" stroke="#111827" stroke-width="2"/>
<text x="1040" y="38" font-size="13" fill="#374151" font-weight="normal" text-anchor="start" data-item-id="H05">マイページ</text>
<rect x="1180" y="16" width="220" height="32" rx="16" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" data-item-id="H07"/>
<text x="1196" y="37" font-size="11" fill="#374151" font-weight="normal" text-anchor="start">● user@example.com（Free）</text>
<text x="720" y="128" font-size="26" fill="#111827" font-weight="bold" text-anchor="middle" data-item-id="H09">料金プラン</text>
<text x="720" y="160" font-size="13" fill="#4b5563" font-weight="normal" text-anchor="middle" data-item-id="H10">日本語要約での論文チェックは無料で。詳しい解説と AI 機能は Pro で。</text>
<rect x="280" y="196" width="420" height="380" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="304" y="232" font-size="20" fill="#111827" font-weight="bold" text-anchor="start" data-item-id="H13">Free</text>
<text x="304" y="272" font-size="26" fill="#111827" font-weight="bold" text-anchor="start" data-item-id="H14">0円</text>
<text x="360" y="272" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start">/ 月</text>
<g data-item-id="H15">
<text x="304" y="308" font-size="12" fill="#374151" font-weight="normal" text-anchor="start">✓ 新着論文の検索（日付・カテゴリ・キーワード）</text>
<text x="304" y="332" font-size="12" fill="#374151" font-weight="normal" text-anchor="start">✓ 30秒要約（短い日本語要約）</text>
<text x="304" y="356" font-size="12" fill="#374151" font-weight="normal" text-anchor="start">✓ 3分要約（標準要約）</text>
<text x="304" y="380" font-size="12" fill="#374151" font-weight="normal" text-anchor="start">✓ 基本のおすすめ</text>
<text x="304" y="404" font-size="12" fill="#374151" font-weight="normal" text-anchor="start">✓ ブックマーク</text>
</g>
<rect x="304" y="520" width="372" height="36" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1" data-item-id="H16"/>
<text x="490.0" y="543" font-size="12" fill="#374151" font-weight="bold" text-anchor="middle">現在のプラン</text>
<rect x="740" y="196" width="420" height="380" rx="10" fill="#ffffff" stroke="#111827" stroke-width="2"/>
<text x="764" y="232" font-size="20" fill="#111827" font-weight="bold" text-anchor="start" data-item-id="H18">Pro</text>
<text x="764" y="272" font-size="26" fill="#111827" font-weight="bold" text-anchor="start" data-item-id="H19">980円</text>
<text x="850" y="272" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start">/ 月</text>
<g data-item-id="H20">
<text x="764" y="308" font-size="12" fill="#374151" font-weight="normal" text-anchor="start">✓ Free のすべての機能</text>
<text x="764" y="332" font-size="12" fill="#374151" font-weight="normal" text-anchor="start">✓ 10分解説（専門的な詳細解説）</text>
<text x="764" y="356" font-size="12" fill="#374151" font-weight="normal" text-anchor="start">✓ AIチャット</text>
<text x="764" y="380" font-size="12" fill="#374151" font-weight="normal" text-anchor="start">✓ 複数論文の比較</text>
<text x="764" y="404" font-size="12" fill="#374151" font-weight="normal" text-anchor="start">✓ カスタム通知</text>
</g>
<rect x="890" y="391" width="52" height="18" rx="9" fill="#fef3c7" stroke="#fcd34d" stroke-width="1" data-item-id="H21"/>
<text x="916" y="404" font-size="10" fill="#92400e" font-weight="normal" text-anchor="middle">準備中</text>
<text x="764" y="434" font-size="10" fill="#6b7280" font-weight="normal" text-anchor="start" data-item-id="H22">※ AIチャット・比較は1か月あたりの利用回数に上限があります。</text>
<rect x="764" y="520" width="372" height="36" rx="6" fill="#111827" stroke="#111827" stroke-width="1" data-item-id="H23"/>
<text x="950.0" y="542.0" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">Pro に申し込む</text>
<text x="280" y="616" font-size="11" fill="#6b7280" font-weight="normal" text-anchor="start" data-item-id="H29">お支払いは月ごとの自動更新です。解約はいつでもでき、解約後も期間の終わりまで Pro を使えます。</text>
<text x="280" y="638" font-size="11" fill="#6b7280" font-weight="normal" text-anchor="start" data-item-id="H30">決済は Stripe で行います。カード情報は本サービスに保存されません。</text>
<rect x="0" y="686" width="1440" height="64" rx="0" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
<text x="40" y="722" font-size="11" fill="#6b7280" font-weight="normal" text-anchor="start" data-item-id="H42">本サービスはarXivが運営するものではありません。論文の原文と権利は各著者およびarXivに帰属します。</text>
<text x="1360" y="722" font-size="11" fill="#2563eb" font-weight="normal" text-anchor="start" data-item-id="H43">利用規約</text>
</svg>
