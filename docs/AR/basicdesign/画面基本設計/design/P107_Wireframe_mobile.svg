<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 414 1076" width="414" height="1076" font-family="Noto Sans JP, sans-serif" font-size="11" role="img" aria-label="料金 ワイヤーフレーム（モバイル）">
<rect x="0" y="0" width="414" height="1076" fill="#ffffff"/>
<rect x="0" y="0" width="414" height="56" rx="0" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
<rect x="16" y="12" width="150" height="32" rx="6" fill="#111827" stroke="#111827" stroke-width="1" data-item-id="H01"/>
<text x="91" y="33" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">サービス名（未決定）</text>
<rect x="358" y="10" width="40" height="36" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1" data-item-id="H08"/>
<line x1="368" y1="20" x2="388" y2="20" stroke="#374151" stroke-width="2"/>
<line x1="368" y1="28" x2="388" y2="28" stroke="#374151" stroke-width="2"/>
<line x1="368" y1="36" x2="388" y2="36" stroke="#374151" stroke-width="2"/>
<text x="207" y="100" font-size="22" fill="#111827" font-weight="bold" text-anchor="middle" data-item-id="H09">料金プラン</text>
<text x="207" y="126" font-size="11" fill="#4b5563" font-weight="normal" text-anchor="middle" data-item-id="H10">論文チェックは無料で。詳しい解説と AI 機能は Pro で。</text>
<rect x="16" y="148" width="382" height="340" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="40" y="184" font-size="20" fill="#111827" font-weight="bold" text-anchor="start" data-item-id="H13">Free</text>
<text x="40" y="224" font-size="26" fill="#111827" font-weight="bold" text-anchor="start" data-item-id="H14">0円</text>
<text x="96" y="224" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start">/ 月</text>
<g data-item-id="H15">
<text x="40" y="260" font-size="12" fill="#374151" font-weight="normal" text-anchor="start">✓ 新着論文の検索（日付・カテゴリ・キーワード）</text>
<text x="40" y="284" font-size="12" fill="#374151" font-weight="normal" text-anchor="start">✓ 30秒要約（短い日本語要約）</text>
<text x="40" y="308" font-size="12" fill="#374151" font-weight="normal" text-anchor="start">✓ 3分要約（標準要約）</text>
<text x="40" y="332" font-size="12" fill="#374151" font-weight="normal" text-anchor="start">✓ 基本のおすすめ</text>
<text x="40" y="356" font-size="12" fill="#374151" font-weight="normal" text-anchor="start">✓ ブックマーク</text>
</g>
<rect x="40" y="432" width="334" height="36" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1" data-item-id="H16"/>
<text x="207.0" y="455" font-size="12" fill="#374151" font-weight="bold" text-anchor="middle">現在のプラン</text>
<rect x="16" y="508" width="382" height="380" rx="10" fill="#ffffff" stroke="#111827" stroke-width="2"/>
<text x="40" y="544" font-size="20" fill="#111827" font-weight="bold" text-anchor="start" data-item-id="H18">Pro</text>
<text x="40" y="584" font-size="26" fill="#111827" font-weight="bold" text-anchor="start" data-item-id="H19">980円</text>
<text x="126" y="584" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start">/ 月</text>
<g data-item-id="H20">
<text x="40" y="620" font-size="12" fill="#374151" font-weight="normal" text-anchor="start">✓ Free のすべての機能</text>
<text x="40" y="644" font-size="12" fill="#374151" font-weight="normal" text-anchor="start">✓ 10分解説（専門的な詳細解説）</text>
<text x="40" y="668" font-size="12" fill="#374151" font-weight="normal" text-anchor="start">✓ AIチャット</text>
<text x="40" y="692" font-size="12" fill="#374151" font-weight="normal" text-anchor="start">✓ 複数論文の比較</text>
<text x="40" y="716" font-size="12" fill="#374151" font-weight="normal" text-anchor="start">✓ カスタム通知</text>
</g>
<rect x="166" y="703" width="52" height="18" rx="9" fill="#fef3c7" stroke="#fcd34d" stroke-width="1" data-item-id="H21"/>
<text x="192" y="716" font-size="10" fill="#92400e" font-weight="normal" text-anchor="middle">準備中</text>
<text x="40" y="746" font-size="10" fill="#6b7280" font-weight="normal" text-anchor="start" data-item-id="H22">※ AIチャット・比較は1か月あたりの利用回数に上限があります。</text>
<rect x="40" y="832" width="334" height="36" rx="6" fill="#111827" stroke="#111827" stroke-width="1" data-item-id="H23"/>
<text x="207.0" y="854.0" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">Pro に申し込む</text>
<text x="16" y="916" font-size="10" fill="#6b7280" font-weight="normal" text-anchor="start" data-item-id="H29">お支払いは月ごとの自動更新です。解約はいつでもでき、</text>
<text x="16" y="932" font-size="10" fill="#6b7280" font-weight="normal" text-anchor="start">解約後も期間の終わりまで Pro を使えます。</text>
<text x="16" y="956" font-size="10" fill="#6b7280" font-weight="normal" text-anchor="start" data-item-id="H30">決済は Stripe で行います。カード情報は本サービスに</text>
<text x="16" y="972" font-size="10" fill="#6b7280" font-weight="normal" text-anchor="start">保存されません。</text>
<rect x="0" y="1004" width="414" height="72" rx="0" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
<text x="16" y="1028" font-size="9" fill="#6b7280" font-weight="normal" text-anchor="start" data-item-id="H42">本サービスはarXivが運営するものではありません。</text>
<text x="16" y="1042" font-size="9" fill="#6b7280" font-weight="normal" text-anchor="start">論文の原文と権利は各著者およびarXivに帰属します。</text>
<text x="16" y="1064" font-size="10" fill="#2563eb" font-weight="normal" text-anchor="start" data-item-id="H43">利用規約</text>
</svg>
