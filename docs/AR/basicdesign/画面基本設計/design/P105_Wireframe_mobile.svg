<text x="32" y="460" font-size="11" fill="#1f2937" font-weight="normal" text-anchor="start">上位k件だけを残して計算量を減らす（§3.1, p.4）。</text>
<text x="32" y="484" font-size="10" fill="#6b7280" font-weight="normal" text-anchor="start">出典: 原文 §3.1 p.4</text>
