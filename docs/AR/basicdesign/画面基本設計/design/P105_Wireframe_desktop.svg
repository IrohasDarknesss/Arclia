<rect x="220" y="350" width="1000" height="170" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
<text x="236" y="376" font-size="15" fill="#111827" font-weight="bold" text-anchor="start">数式解説</text>
<g data-item-id="H17">
<rect x="236" y="390" width="968" height="40" rx="4" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="720.0" y="416" font-size="13" fill="#111827" font-weight="normal" text-anchor="middle">Attention(Q,K,V) = softmax(QKᵀ / √d) V</text>
<text x="236" y="452" font-size="11" fill="#1f2937" font-weight="normal" text-anchor="start">式(1)：各トークンの問い合わせ Q と鍵 K の近さを計算し、値 V の重み付き平均を取る。</text>
<text x="236" y="474" font-size="11" fill="#1f2937" font-weight="normal" text-anchor="start">本論文は近さの上位k件だけを残し、残りを0として計算量を減らす（§3.1, p.4）。</text>
<text x="236" y="498" font-size="10" fill="#6b7280" font-weight="normal" text-anchor="start">出典: 原文 §3.1 p.4</text>
</g>
